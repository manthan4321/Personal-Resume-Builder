<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Now</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #00695c;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
        }

        input,
        textarea {
            margin-top: 5px;
            padding: 10px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            font-size: 16px;
            background-color: #00695c;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d40;
        }

        #resume {
            border: 1px solid #ccc;
            padding: 20px;
            background-color: #f9f9f9;
            margin-top: 20px;
            text-align: left;
        }

        h2,
        h3 {
            color: #004d40;
            margin-bottom: 10px;
        }

        #resume-section {
            text-align: center;
        }

        button#edit-btn {
            margin-right: 10px;
        }

        #photo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        #photo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            border: 2px solid #00695c;
        }

        .section {
            margin-bottom: 20px;
        }

        .section hr {
            border: 0;
            border-top: 2px solid #00695c;
            margin: 10px 0;
        }

        .section-content {
            text-align: left;
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .section-content li {
            margin: 5px 0;
        }
        #name, #contact {
        text-align: center;
        /* margin: 0; Adjust margin if needed */
}

    </style>
</head>

<body>
    <div class="container">
        <h1>Resume Now</h1>
        <div id="form-section">
            <form id="resume-form">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>

                <label for="photo">Upload Photo:</label>
                <input type="file" id="photo" accept="image/*">

                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Phone:</label>
                <input type="text" id="phone" placeholder="Enter your phone number" required>

                <label for="education">Education (comma-separated):</label>
                <textarea id="education" placeholder="Enter your education details" required></textarea>

                <label for="experience">Experience (comma-separated):</label>
                <textarea id="experience" placeholder="Enter your work experience"></textarea>

                <label for="skills">Skills (comma-separated):</label>
                <textarea id="skills" placeholder="Enter your skills" required></textarea>

                <button type="button" id="generate-btn">Generate Resume</button>
            </form>
        </div>

        <div id="resume-section" style="display: none;">
            <div id="resume">
                <div id="photo-container"></div>
                <h2 id="name"></h2>
                <p id="contact"></p>

                <div class="section">
                    <h3>Education</h3>
                    <hr>
                    <div id="education-details" class="section-content"></div>
                </div>

                <div class="section">
                    <h3>Experience</h3>
                    <hr>
                    <div id="experience-details" class="section-content"></div>
                </div>

                <div class="section">
                    <h3>Skills</h3>
                    <hr>
                    <div id="skills-details" class="section-content"></div>
                </div>
            </div>
            <button id="edit-btn">Edit</button>
            <button id="download-btn">Download PDF</button>
        </div>
    </div>
    <script>
        document.getElementById('generate-btn').addEventListener('click', function () {
            // Get user input values
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const education = document.getElementById('education').value.split(',,');
            const experience = document.getElementById('experience').value.split(',,');
            const skills = document.getElementById('skills').value.split(',,');
            const photo = document.getElementById('photo').files[0];

            // Populate the resume section
            document.getElementById('name').textContent = fullName;
            document.getElementById('contact').textContent = `${email} | ${phone}`;
            populateSection('education-details', education);
            populateSection('experience-details', experience);
            populateSection('skills-details', skills);

            // Display photo if uploaded
            const photoContainer = document.getElementById('photo-container');
            photoContainer.innerHTML = ''; // Clear previous photo
            if (photo) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    photoContainer.appendChild(img);
                };
                reader.readAsDataURL(photo);
            }

            // Toggle visibility
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('resume-section').style.display = 'block';
        });

        document.getElementById('edit-btn').addEventListener('click', function () {
            document.getElementById('form-section').style.display = 'block';
            document.getElementById('resume-section').style.display = 'none';
        });

        document.getElementById('download-btn').addEventListener('click', function () {
            window.print(); // Opens the print dialog to save as PDF
        });

        // Helper function to populate sections without bullet points
        function populateSection(id, items) {
            const section = document.getElementById(id);
            section.innerHTML = ''; // Clear previous items
            items.forEach(item => {
                if (item.trim()) {
                    const div = document.createElement('div');
                    div.textContent = item.trim();
                    section.appendChild(div);
                }
            });
        
        }
    </script>
</body>

</html>
