        #carousel-container {

            color: black;
            font-size:20px ;

        }
        #profile-section {

            right: -300px;
            top: 10vh;
            width: 300px;
            height: calc(100vh - 10vh);
            background: white;
            box-shadow: -4px 0px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow-y: auto;
            border-radius: 10px 0 0 10px;

        }

        #profile-section.open {

        }

            background: #2c7a7b;
            color: white;
            border: none;

        const items = document.querySelectorAll('.carousel-item');

        function showSlide(index) {
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % items.length;
            showSlide(currentIndex);
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            showSlide(currentIndex);
        }

document.getElementById("changePasswordBtn").addEventListener("click", function () {
    // Retrieve sign_upData from local storage
    let signUpData = JSON.parse(localStorage.getItem("sign_upData")) || [];
    let loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));

    // Find the logged-in user in sign_upData
    let userIndex = signUpData.findIndex(user => user.username === loggedInUser.username);

    if (userIndex !== -1) {
        // Prompt the user to enter their old password
        let oldPassword = prompt("Enter your old password:");
        
        // Check if the old password matches the user's current password
        if (oldPassword === loggedInUser.password) {
            // Prompt the user to enter their new password
            let newPassword = prompt("Enter your new password:");
            
            // Check if the new password is the same as the old password
            if (newPassword === oldPassword) {
                alert("New password cannot be the same as the old password!");
            } else {
                // Update the user's password in both loggedInUser and sign_upData
                loggedInUser.password = newPassword;
                signUpData[userIndex].password = newPassword;

                // Save the updated data back to local storage
                localStorage.setItem("loggedInUser", JSON.stringify(loggedInUser));
                localStorage.setItem("sign_upData", JSON.stringify(signUpData));

                alert("Password changed successfully!");
            }
        } else {
            alert("Incorrect old password!");
        }
    } else {
        alert("User not found in sign_upData!");
    }
});

        const profileImageInput = document.getElementById("profileImageInput");
        const profilePicture = document.getElementById("profilePicture");

        profileImageInput.addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    profilePicture.src = e.target.result;
                    // alert("Profile picture updated successfully!");
                };
                reader.readAsDataURL(file);
            }
        });
