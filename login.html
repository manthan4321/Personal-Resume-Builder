// Add an event listener to the login form
document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        // Get the user's email and password from the form
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;

        // Check if the user's credentials match a user in local storage
        let users = JSON.parse(localStorage.getItem("sign_upData"));
        let loggedInUser = users.find(user => user.email === email && user.password === password);

        if (loggedInUser) {
            // Store the logged-in user's data in local storage
            localStorage.setItem("loggedInUser", JSON.stringify(loggedInUser));

            // Redirect the user to the template page with the username as a query parameter
            window.location.href = "template.html?username=" + loggedInUser.username;
        } else {
            // alert("Invalid email or password!");
            let errorMessage = document.getElementById("errorMessage");
        errorMessage.innerText = "Invalid Email or Password";
        }
    });
